<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Karyawan</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }

        h2,
        h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.3s;
            min-width: 100px;
        }

        .btn-in {
            background-color: #28a745;
        }

        .btn-in:hover {
            background-color: #218838;
        }

        .btn-out {
            background-color: #dc3545;
        }

        .btn-out:hover {
            background-color: #c82333;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #333;
            padding: 10px;
            border-radius: 5px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .info {
            background-color: #e2e3e5;
            color: #383d41;
        }

        .history-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Absensi Karyawan</h2>

        <div class="input-group">
            <label for="userId">ID Karyawan</label>
            <input type="text" id="userId" placeholder="Misal: KB-001" autocomplete="off">
        </div>

        <div class="btn-group">
            <button class="btn-in" onclick="prosesAbsen('check_in')">Check In</button>
            <button class="btn-out" onclick="prosesAbsen('check_out')">Check Out</button>
        </div>

        <div id="status" class="info">Silakan masukkan ID dan pilih aksi.</div>
    </div>

    <div class="history-card">
        <h3>Riwayat Absensi</h3>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Jam Masuk</th>
                    <th>Jam Keluar</th>
                    <th>Lokasi Masuk</th>
                    <th>Lokasi Keluar</th>
                </tr>
            </thead>
            <tbody id="tabelRiwayat">
                <tr>
                    <td colspan="5" style="color: #888;">Belum ada data yang dimuat. Riwayat akan muncul setelah
                        melakukan absen.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const supabaseUrl = 'https://jsepisnthcrtbeagimal.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzZXBpc250aGNydGJlYWdpbWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDcxNzIsImV4cCI6MjA5NTk4MzE3Mn0.sQ7VVTbhdqSwD_BDNoG6ACe7XCMLNUQJHl1_X0PTsrg';

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        const namaTabel = 'absensi';

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = message;
            statusEl.className = type;
        }

        async function dapatkanAlamat(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                const data = await response.json();
                return data.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            } catch (error) {
                console.error("Gagal mendapatkan alamat dari OpenStreetMap:", error);
                return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            }
        }

        function prosesAbsen(tipeAbsen) {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                showStatus("Harap isi ID Karyawan terlebih dahulu!", "error");
                return;
            }

            showStatus("Sedang mendapatkan lokasi GPS...", "info");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        showStatus("Menerjemahkan koordinat ke nama jalan...", "info");
                        const alamatLengkap = await dapatkanAlamat(lat, lon);

                        showStatus("Lokasi ditemukan. Mengirim data ke server...", "info");
                        kirimKeSupabase(userId, tipeAbsen, lat, lon, alamatLengkap);
                    },
                    (error) => {
                        console.warn("Error Lokasi:", error);
                        showStatus("Gagal akses lokasi. Pastikan GPS aktif dan izin diberikan.", "error");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                showStatus("Browser kamu tidak mendukung deteksi lokasi.", "error");
            }
        }

        async function kirimKeSupabase(userId, tipe, lat, lon, alamatLengkap) {
            const now = new Date();
            const tanggalHariIni = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const waktuSekarang = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');

            try {
                const { data: cekData, error: cekError } = await supabaseClient
                    .from(namaTabel)
                    .select('*')
                    .eq('user_id', userId)
                    .eq('tanggal', tanggalHariIni)
                    .maybeSingle();

                if (cekError) throw cekError;

                if (tipe === 'check_in') {
                    if (cekData) {
                        showStatus("Akses Ditolak: Kamu sudah Check In hari ini!", "error");
                        return;
                    }

                    const { error } = await supabaseClient
                        .from(namaTabel)
                        .insert([{
                            user_id: userId,
                            tanggal: tanggalHariIni,
                            check_in: waktuSekarang,
                            lat_check_in: lat,
                            long_check_in: lon,
                            alamat_check_in: alamatLengkap
                        }]);

                    if (error) throw error;
                    showStatus("✅ Check In Berhasil (" + waktuSekarang + ")", "success");
                    muatRiwayat();
                }

                else if (tipe === 'check_out') {
                    if (!cekData) {
                        showStatus("Akses Ditolak: Kamu belum Check In hari ini!", "error");
                        return;
                    }
                    if (cekData.check_out !== null) {
                        showStatus("Akses Ditolak: Kamu sudah melakukan Check Out hari ini!", "error");
                        return;
                    }

                    const { error } = await supabaseClient
                        .from(namaTabel)
                        .update({
                            check_out: waktuSekarang,
                            lat_check_out: lat,
                            long_check_out: lon,
                            alamat_check_out: alamatLengkap
                        })
                        .eq('id', cekData.id);

                    if (error) throw error;
                    showStatus("✅ Check Out Berhasil (" + waktuSekarang + ")", "success");
                    muatRiwayat();
                }

            } catch (err) {
                console.error("Terjadi kesalahan Supabase:", err);
                showStatus("Gagal terhubung ke database.", "error");
            }
        }

        async function muatRiwayat() {
            const userId = document.getElementById('userId').value.trim();
            const tabelBody = document.getElementById('tabelRiwayat');

            if (!userId) {
                return; // Dihapus alert errornya agar tidak muncul saat awal buka halaman
            }

            tabelBody.innerHTML = `<tr><td colspan="5">Memuat riwayat...</td></tr>`;

            try {
                const { data: listAbsen, error } = await supabaseClient
                    .from(namaTabel)
                    .select('*')
                    .eq('user_id', userId)
                    .order('tanggal', { ascending: false })
                    .order('check_in', { ascending: false });

                if (error) throw error;

                if (!listAbsen || listAbsen.length === 0) {
                    tabelBody.innerHTML = `<tr><td colspan="5" style="color: #888;">Tidak ada riwayat absensi untuk ID ini.</td></tr>`;
                    return;
                }

                tabelBody.innerHTML = "";

                listAbsen.forEach(row => {
                    const jamMasuk = row.check_in || '-';
                    const jamKeluar = row.check_out || '-';

                    const lokasiMasuk = row.alamat_check_in || (row.lat_check_in ? `${row.lat_check_in.toFixed(4)}, ${row.long_check_in.toFixed(4)}` : '-');
                    const lokasiKeluar = row.alamat_check_out || (row.lat_check_out ? `${row.lat_check_out.toFixed(4)}, ${row.long_check_out.toFixed(4)}` : '-');

                    const htmlRow = `
                        <tr>
                            <td><strong>${row.tanggal}</strong></td>
                            <td style="color: #28a745; font-weight: bold;">${jamMasuk}</td>
                            <td style="color: #dc3545; font-weight: bold;">${jamKeluar}</td>
                            <td style="font-size: 12px; color: #555;">${lokasiMasuk}</td>
                            <td style="font-size: 12px; color: #555;">${lokasiKeluar}</td>
                        </tr>
                    `;
                    tabelBody.innerHTML += htmlRow;
                });

            } catch (err) {
                console.error("Gagal memuat riwayat:", err);
                tabelBody.innerHTML = `<tr><td colspan="5" style="color: red;">Gagal memuat data dari database.</td></tr>`;
            }
        }
    </script>
</body>

</html>
