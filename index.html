<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Karyawan</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .card { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        .history-card { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 800px; overflow-x: auto; display: none; }
        
        h2, h3 { color: #333; margin-top: 0; margin-bottom: 20px; }
        p.subtitle { color: #666; margin-top: -10px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; font-size: 14px; }
        
        input[type="text"], input[type="password"], select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; background-color: white;
        }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; margin-bottom: 10px; }
        .btn-login { background-color: #007bff; } .btn-login:hover { background-color: #0069d9; }
        
        .btn-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn-group .btn { margin-bottom: 0; }
        .btn-in { background-color: #28a745; } .btn-in:hover { background-color: #218838; }
        .btn-out { background-color: #dc3545; } .btn-out:hover { background-color: #c82333; }
        
        .btn-logout { background-color: #6c757d; margin-top: 20px; font-size: 13px; padding: 10px; } .btn-logout:hover { background-color: #5a6268; }

        #status { margin-top: 20px; font-size: 13px; color: #333; padding: 10px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #e2e3e5; color: #383d41; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; color: #333; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        #absenSection { display: none; }
        .posisi-badge { color: #007bff; font-weight: bold; font-size: 13px; display: block; margin-top: 5px; }
    </style>
</head>

<body>

    <div class="card" id="loginSection">
        <h2>Portal Karyawan</h2>
        <p class="subtitle">Silakan masuk dengan akun yang diberikan HRD</p>

        <div class="input-group">
            <label>ID Karyawan</label>
            <input type="text" id="loginId" placeholder="Misal: KB-001" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Masukkan kata sandi">
        </div>

        <button class="btn btn-login" onclick="prosesLogin()">Masuk / Login</button>
        <div id="loginStatus" style="margin-top: 10px; font-size: 13px; color: red;"></div>
    </div>


    <div class="card" id="absenSection">
        <h2>Absensi Karyawan</h2>
        <p class="subtitle" id="teksSapaan">
            Halo, Nama Karyawan!
            <span class="posisi-badge" id="teksPosisi">Posisi</span>
        </p>

        <div class="input-group">
            <label>Pilih Lokasi Kantor</label>
            <select id="lokasiKantor">
                <option value="" disabled selected>-- Memuat Lokasi... --</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-in" onclick="prosesAbsen('check_in')">Check In</button>
            <button class="btn btn-out" onclick="prosesAbsen('check_out')">Check Out</button>
        </div>

        <div id="status" class="info">Silakan pilih aksi.</div>
        
        <button class="btn btn-logout" onclick="prosesLogout()">Keluar (Logout)</button>
    </div>

    <div class="history-card" id="historySection">
        <h3>Riwayat Absensiku</h3>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Jam Masuk</th>
                    <th>Jam Keluar</th>
                    <th>Lokasi Masuk</th>
                    <th>Lokasi Keluar</th>
                </tr>
            </thead>
            <tbody id="tabelRiwayat">
                <tr><td colspan="5" style="color: #888;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE
        // ==========================================
        const supabaseUrl = 'https://jsepisnthcrtbeagimal.supabase.co';
        // PASTE ANON KEY KAMU DI BAWAH INI:
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzZXBpc250aGNydGJlYWdpbWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDcxNzIsImV4cCI6MjA5NTk4MzE3Mn0.sQ7VVTbhdqSwD_BDNoG6ACe7XCMLNUQJHl1_X0PTsrg';

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        const tabelAbsensi = 'absensi';
        const tabelKaryawan = 'karyawan';
        const tabelLokasi = 'lokasi_kantor'; // Nama tabel baru untuk dropdown

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.innerText = message;
            statusEl.className = type;
        }

        // ==========================================
        // 2. FUNGSI MUAT DROPDOWN DINAMIS
        // ==========================================
        async function muatLokasiKantor() {
            const dropdown = document.getElementById('lokasiKantor');
            
            try {
                // Tarik data dari tabel lokasi_kantor dan urutkan sesuai abjad A-Z
                const { data, error } = await supabaseClient
                    .from(tabelLokasi)
                    .select('nama_kantor')
                    .order('nama_kantor', { ascending: true });

                if (error) throw error;

                // Reset dan siapkan opsi pertama (placeholder)
                dropdown.innerHTML = '<option value="" disabled selected>-- Pilih Lokasi Kantor --</option>';

                // Masukkan hasil dari database ke dalam tag <option>
                if (data && data.length > 0) {
                    data.forEach(kantor => {
                        const option = document.createElement('option');
                        option.value = kantor.nama_kantor;
                        option.text = kantor.nama_kantor;
                        dropdown.appendChild(option);
                    });
                } else {
                    dropdown.innerHTML = '<option value="" disabled selected>-- Belum ada data lokasi --</option>';
                }
            } catch (err) {
                console.error("Gagal memuat lokasi kantor:", err);
                dropdown.innerHTML = '<option value="" disabled selected>-- Gagal memuat lokasi --</option>';
            }
        }

        // ==========================================
        // 3. LOGIKA AUTENTIKASI (LOGIN / LOGOUT)
        // ==========================================
        window.onload = () => {
            const loggedInId = localStorage.getItem('absen_userId');
            const loggedInName = localStorage.getItem('absen_userName');
            const loggedInPosisi = localStorage.getItem('absen_userPosisi');
            
            if (loggedInId && loggedInName) {
                tampilkanHalamanAbsen(loggedInId, loggedInName, loggedInPosisi);
            }
        };

        async function prosesLogin() {
            const idInput = document.getElementById('loginId').value.trim();
            const passInput = document.getElementById('loginPass').value.trim();
            const statusEl = document.getElementById('loginStatus');

            if (!idInput || !passInput) {
                statusEl.innerText = "ID dan Password wajib diisi!";
                return;
            }

            statusEl.style.color = 'blue';
            statusEl.innerText = "Mengecek kredensial...";

            try {
                const { data, error } = await supabaseClient
                    .from(tabelKaryawan)
                    .select('*')
                    .eq('user_id', idInput)
                    .eq('password', passInput)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    localStorage.setItem('absen_userId', data.user_id);
                    localStorage.setItem('absen_userName', data.nama);
                    localStorage.setItem('absen_userPosisi', data.posisi || 'Staff');
                    
                    statusEl.innerText = "";
                    tampilkanHalamanAbsen(data.user_id, data.nama, data.posisi);
                } else {
                    statusEl.style.color = 'red';
                    statusEl.innerText = "ID atau Password salah!";
                }
            } catch (err) {
                console.error("Error login:", err);
                statusEl.style.color = 'red';
                statusEl.innerText = "Terjadi kesalahan koneksi database.";
            }
        }

        function prosesLogout() {
            localStorage.removeItem('absen_userId');
            localStorage.removeItem('absen_userName');
            localStorage.removeItem('absen_userPosisi');
            
            document.getElementById('loginId').value = '';
            document.getElementById('loginPass').value = '';
            
            document.getElementById('absenSection').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
            
            document.body.style.justifyContent = 'center';
            document.getElementById('loginSection').style.display = 'block';
        }

        function tampilkanHalamanAbsen(userId, userName, userPosisi) {
            document.getElementById('loginSection').style.display = 'none';
            document.body.style.justifyContent = 'flex-start'; 
            document.getElementById('absenSection').style.display = 'block';
            document.getElementById('historySection').style.display = 'block';
            
            const posisiFinal = userPosisi ? userPosisi : 'Staff';
            
            document.getElementById('teksSapaan').innerHTML = `
                Halo, <strong>${userName}</strong> (${userId})
                <span class="posisi-badge">💼 ${posisiFinal}</span>
            `;
            
            document.getElementById('status').style.display = 'none';
            
            // Panggil 2 fungsi sekaligus saat halaman absen terbuka
            muatRiwayat(); 
            muatLokasiKantor(); 
        }

        // ==========================================
        // 4. FUNGSI GPS & ALAMAT
        // ==========================================
        async function dapatkanAlamat(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
                const data = await response.json();
                return data.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            } catch (error) {
                return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            }
        }

        // ==========================================
        // 5. PROSES CHECK IN & CHECK OUT
        // ==========================================
        function prosesAbsen(tipeAbsen) {
            const userId = localStorage.getItem('absen_userId');
            const dropdownKantor = document.getElementById('lokasiKantor');
            const kantorPilihan = dropdownKantor.value;
            
            if (!userId) {
                alert("Sesi kamu telah habis, silakan login ulang.");
                prosesLogout();
                return;
            }

            if (!kantorPilihan) {
                showStatus("Harap pilih Lokasi Kantor terlebih dahulu!", "error");
                return;
            }

            showStatus("Sedang mendapatkan lokasi GPS...", "info");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        showStatus("Menerjemahkan koordinat ke nama jalan...", "info");
                        const alamatGPS = await dapatkanAlamat(lat, lon);
                        const alamatFinal = `[${kantorPilihan}] ${alamatGPS}`;

                        showStatus("Lokasi ditemukan. Mengirim data ke server...", "info");
                        kirimKeSupabase(userId, tipeAbsen, lat, lon, alamatFinal);
                    },
                    (error) => {
                        showStatus("Gagal akses lokasi. Pastikan GPS aktif dan izin diberikan.", "error");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                showStatus("Browser kamu tidak mendukung deteksi lokasi.", "error");
            }
        }

        async function kirimKeSupabase(userId, tipe, lat, lon, alamatLengkap) {
            const now = new Date();
            const tanggalHariIni = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const waktuSekarang = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');

            try {
                const { data: cekData, error: cekError } = await supabaseClient
                    .from(tabelAbsensi)
                    .select('*')
                    .eq('user_id', userId)
                    .eq('tanggal', tanggalHariIni)
                    .maybeSingle();

                if (cekError) throw cekError;

                if (tipe === 'check_in') {
                    if (cekData) {
                        showStatus("Akses Ditolak: Kamu sudah Check In hari ini!", "error");
                        return;
                    }

                    const { error } = await supabaseClient
                        .from(tabelAbsensi)
                        .insert([{
                            user_id: userId,
                            tanggal: tanggalHariIni,
                            check_in: waktuSekarang,
                            lat_check_in: lat,
                            long_check_in: lon,
                            alamat_check_in: alamatLengkap
                        }]);

                    if (error) throw error;
                    showStatus("✅ Check In Berhasil (" + waktuSekarang + ")", "success");
                    muatRiwayat();
                }
                else if (tipe === 'check_out') {
                    if (!cekData) {
                        showStatus("Akses Ditolak: Kamu belum Check In hari ini!", "error");
                        return;
                    }
                    if (cekData.check_out !== null) {
                        showStatus("Akses Ditolak: Kamu sudah melakukan Check Out hari ini!", "error");
                        return;
                    }

                    const { error } = await supabaseClient
                        .from(tabelAbsensi)
                        .update({
                            check_out: waktuSekarang,
                            lat_check_out: lat,
                            long_check_out: lon,
                            alamat_check_out: alamatLengkap
                        })
                        .eq('id', cekData.id);

                    if (error) throw error;
                    showStatus("✅ Check Out Berhasil (" + waktuSekarang + ")", "success");
                    muatRiwayat();
                }

            } catch (err) {
                showStatus("Gagal terhubung ke database.", "error");
            }
        }

        // ==========================================
        // 6. MUAT RIWAYAT
        // ==========================================
        async function muatRiwayat() {
            const userId = localStorage.getItem('absen_userId');
            const tabelBody = document.getElementById('tabelRiwayat');

            if (!userId) return;

            tabelBody.innerHTML = `<tr><td colspan="5">Memuat riwayat...</td></tr>`;

            try {
                const { data: listAbsen, error } = await supabaseClient
                    .from(tabelAbsensi)
                    .select('*')
                    .eq('user_id', userId)
                    .order('tanggal', { ascending: false });

                if (error) throw error;

                if (!listAbsen || listAbsen.length === 0) {
                    tabelBody.innerHTML = `<tr><td colspan="5" style="color: #888;">Belum ada riwayat absensi.</td></tr>`;
                    return;
                }

                tabelBody.innerHTML = "";

                listAbsen.forEach(row => {
                    const jamMasuk = row.check_in || '-';
                    const jamKeluar = row.check_out || '-';
                    const lokasiMasuk = row.alamat_check_in || '-';
                    const lokasiKeluar = row.alamat_check_out || '-';

                    const htmlRow = `
                        <tr>
                            <td><strong>${row.tanggal}</strong></td>
                            <td style="color: #28a745; font-weight: bold;">${jamMasuk}</td>
                            <td style="color: #dc3545; font-weight: bold;">${jamKeluar}</td>
                            <td style="font-size: 11px; color: #555; max-width: 170px; text-align: left;">${lokasiMasuk}</td>
                            <td style="font-size: 11px; color: #555; max-width: 170px; text-align: left;">${lokasiKeluar}</td>
                        </tr>
                    `;
                    tabelBody.innerHTML += htmlRow;
                });

            } catch (err) {
                tabelBody.innerHTML = `<tr><td colspan="5" style="color: red;">Gagal memuat data dari database.</td></tr>`;
            }
        }
    </script>
</body>
</html>
